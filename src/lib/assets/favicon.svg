<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Electric Violet (Lower Stem + Middle Wave Crossbar) -->
  <g filter="url(#neon-glow)">
    <!-- Outer Glow -->
    <path d="M 20 52 L 20 34 C 26 26, 38 42, 44 34"
          stroke="#B026FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" />
    <!-- Neon Tube -->
    <path d="M 20 52 L 20 34 C 26 26, 38 42, 44 34"
          stroke="#B026FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Core Highlight -->
    <path d="M 20 52 L 20 34 C 26 26, 38 42, 44 34"
          stroke="#F3E1FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  </g>

  <!-- Acid Green (Upper Stem + Top Wave Arm) -->
  <g filter="url(#neon-glow)">
    <!-- Outer Glow -->
    <path d="M 20 34 L 20 16 C 28 6, 44 26, 52 16"
          stroke="#00FF66" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" />
    <!-- Neon Tube -->
    <path d="M 20 34 L 20 16 C 28 6, 44 26, 52 16"
          stroke="#00FF66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Core Highlight -->
    <path d="M 20 34 L 20 16 C 28 6, 44 26, 52 16"
          stroke="#E2FFE9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  </g>
</svg>
